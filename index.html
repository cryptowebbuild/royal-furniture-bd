                  {/* Polish Choice */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1.5">
                      পছন্দের পলিশ ফিনিশ সিলেক্ট করুন:
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      {POLISH_OPTIONS.map(pol => (
                        <button
                          type="button"
                          key={pol.id}
                          onClick={() => setOrderPolish(pol.id)}
                          className={'p-2 rounded-lg text-left flex items-center gap-2 border transition ' + (
                            orderPolish === pol.id 
                              ? 'bg-amber-500/20 border-amber-400 text-amber-300' 
                              : 'bg-royal-800 border-slate-700 text-slate-300'
                          )}
                        >
                          <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ backgroundColor: pol.hex }}></span>
                          <span className="truncate">{pol.name.split('(')[0]}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Customer Name */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">
                      আপনার নাম <span className="text-red-400">*</span>
                    </label>
                    <input 
                      type="text" 
                      required
                      placeholder="যেমন: মোঃ কামরুল হাসান"
                      value={customerName}
                      onChange={e => setCustomerName(e.target.value)}
                      className="w-full bg-royal-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>

                  {/* Customer Phone */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">
                      মোবাইল নম্বর <span className="text-red-400">*</span>
                    </label>
                    <input 
                      type="tel" 
                      required
                      placeholder="যেমন: 017xxxxxxxx"
                      value={customerPhone}
                      onChange={e => setCustomerPhone(e.target.value)}
                      className="w-full bg-royal-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>

                  {/* Delivery District / Area */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">
                      ডেলিভারি এরিয়া সিলেক্ট করুন:
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setSelectedDistrict('dhaka')}
                        className={'p-2.5 rounded-lg border font-semibold text-center ' + (
                          selectedDistrict === 'dhaka'
                            ? 'bg-emerald-950/60 border-emerald-400 text-emerald-300'
                            : 'bg-royal-800 border-slate-700 text-slate-400'
                        )}
                      >
                        ঢাকা সিটি (ফ্রি ফিটিং ৳০)
                      </button>
                      <button
                        type="button"
                        onClick={() => setSelectedDistrict('outside')}
                        className={'p-2.5 rounded-lg border font-semibold text-center ' + (
                          selectedDistrict === 'outside'
                            ? 'bg-amber-950/60 border-amber-400 text-amber-300'
                            : 'bg-royal-800 border-slate-700 text-slate-400'
                        )}
                      >
                        ঢাকার বাইরে (৳১,৫০০)
                      </button>
                    </div>
                  </div>

                  {/* Full Address */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">
                      পূর্ণাঙ্গ ঠিকানা <span className="text-red-400">*</span>
                    </label>
                    <textarea 
                      required
                      rows="2"
                      placeholder="বাড়ি নং, রোড নং, এলাকা ও থানার নাম..."
                      value={customerAddress}
                      onChange={e => setCustomerAddress(e.target.value)}
                      className="w-full bg-royal-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400"
                    ></textarea>
                  </div>

                  {/* Custom Note */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">
                      বিশেষ নির্দেশনা / রুমের সাইজ (যদি থাকে):
                    </label>
                    <input 
                      type="text" 
                      placeholder="যেমন: বেডরুমের সাইজ ১২x১৪ ফিট, একটু ডার্ক ফিনিশ লাগবে"
                      value={customNote}
                      onChange={e => setCustomNote(e.target.value)}
                      className="w-full bg-royal-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>

                  {/* Price Summary Calculation */}
                  <div className="p-3 rounded-xl bg-royal-950 border border-amber-500/30 space-y-1.5">
                    <div className="flex justify-between text-slate-400">
                      <span>ফার্নিচার মূল্য:</span>
                      <span className="font-semibold text-white">৳{orderModalProduct.price.toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between text-slate-400">
                      <span>ডেলিভারি ও ইন্সটলেশন ফি:</span>
                      <span className="font-semibold text-emerald-400">
                        {deliveryCharge === 0 ? 'ফ্রি (৳০)' : '৳১,৫০০'}
                      </span>
                    </div>
                    <div className="flex justify-between text-sm font-bold text-amber-400 border-t border-slate-800 pt-1.5">
                      <span>সর্বমোট প্রদেয়:</span>
                      <span className="font-cinzel text-base">
                        ৳{(orderModalProduct.price + deliveryCharge).toLocaleString('en-IN')}
                      </span>
                    </div>
                  </div>

                  {/* Submit Button */}
                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-extrabold text-sm shadow-xl shadow-emerald-950/50 transition flex items-center justify-center gap-2"
                  >
                    <span>💬 WhatsApp-এ বুকিং নিশ্চিত করুন</span>
                    <span>➔</span>
                  </button>

                  <p className="text-[10px] text-center text-slate-400">
                    🔒 ক্যাশ অন ডেলিভারি সুবিধা • ডেলিভারির সময় ফার্নিচার পরীক্ষা করে মূল্য পরিশোধ করতে পারবেন।
                  </p>

                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
